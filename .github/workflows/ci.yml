name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Unit and integration suites. Integration tests start their own PostgreSQL through
        # Testcontainers, which GitHub-hosted runners provide.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Governance
        # Stale architecture graph, malformed principle or decision files, and forbidden imports.
        run: pnpm governance
